name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. 의존성 설치 단계 추가 (플랫폼 호환성을 위해 install 사용)
      - name: Install dependencies
        run: npm install

      # 2. 빌드 실행
      - name: Build project
        run: npm run build
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATH_LOG_A777E }}
          channelId: live
          projectId: math-log-a777e